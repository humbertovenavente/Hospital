kind: pipeline
type: docker
name: hospital-build

steps:
- name: build-frontend
  image: node:18-alpine
  commands:
  - echo "Building Hospital Frontend..."
  - npm ci
  - npm run build
  - echo "Frontend build completed"

- name: build-backend
  image: openjdk:17-alpine
  commands:
  - echo "Building Hospital Backend..."
  - cd backend
  - ./mvnw clean compile
  - echo "Backend build completed"

- name: test-frontend
  image: node:18-alpine
  commands:
  - echo "Testing Hospital Frontend..."
  - npm run test:unit
  - echo "Frontend tests completed"

- name: test-backend
  image: openjdk:17-jdk-slim
  environment:
    JAVA_OPTS: "-Djava.awt.headless=true -Djava.security.egd=file:/dev/./urandom"
    MAVEN_OPTS: "-Xmx1024m"
    SPRING_PROFILES_ACTIVE: "test"
    QUARKUS_PROFILE: "test"
  commands:
  - echo "Installing dependencies..."
  - apt-get update && apt-get install -y fontconfig fonts-dejavu-core curl
  - echo "Testing Hospital Backend..."
  - cd backend
  - ./mvnw test -Djava.awt.headless=true -Dspring.profiles.active=test -Dquarkus.profile=test -Dquarkus.test.continuous-testing=disabled
  - echo "Backend tests completed"