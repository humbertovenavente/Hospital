version: '3.8'

services:
  # Drone Server para Google Cloud
  drone-server:
    image: drone/drone:2
    container_name: drone-server-gcp
    ports:
      - "8002:80"
      - "443:443"
    volumes:
      - drone_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Configuración de Drone para GCP
      - DRONE_GITHUB_CLIENT_ID=${DRONE_GITHUB_CLIENT_ID}
      - DRONE_GITHUB_CLIENT_SECRET=${DRONE_GITHUB_CLIENT_SECRET}
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET}
      - DRONE_SERVER_HOST=${DRONE_SERVER_HOST}
      - DRONE_SERVER_PROTO=${DRONE_SERVER_PROTO}
      - DRONE_USER_CREATE=username:${DRONE_ADMIN_USER},admin:true
      - DRONE_LOGS_DEBUG=true
      - DRONE_LOGS_TRACE=true
      
      # Configuración específica para Google Cloud
      - DRONE_DOCKER_ENABLED=true
      - DRONE_DOCKER_HOST=unix:///var/run/docker.sock
      - DRONE_ENVIRONMENT=dev,qa,prod
      
      # Configuración de webhooks (deshabilitado para evitar problemas)
      - DRONE_GITHUB_SKIP_VERIFY=false
      - DRONE_GITHUB_WEBHOOKS=false
      
      # Configuración de seguridad
      - DRONE_SECRET=${DRONE_SECRET}
      - DRONE_AGENTS_ENABLED=true
      
    restart: unless-stopped
    networks:
      - drone-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Drone Runner para Google Cloud
  drone-runner:
    image: drone/drone-runner-docker:1
    container_name: drone-runner-gcp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DRONE_RPC_PROTO=${DRONE_RPC_PROTO}
      - DRONE_RPC_HOST=${DRONE_RPC_HOST}
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET}
      - DRONE_DEBUG=true
      - DRONE_TRACE=true
      
      # Configuración específica para Google Cloud
      - DRONE_DOCKER_ENABLED=true
      - DRONE_DOCKER_HOST=unix:///var/run/docker.sock
      - DRONE_RUNNER_CAPACITY=5
      - DRONE_RUNNER_LABELS=os:linux,arch:amd64,cloud:gcp
      
      # Configuración de recursos
      - DRONE_RUNNER_MAX_PROCS=4
      - DRONE_RUNNER_MAX_QUEUE_SIZE=100
      
    restart: unless-stopped
    depends_on:
      - drone-server
    networks:
      - drone-network

  # Nginx Reverse Proxy para Google Cloud
  nginx:
    image: nginx:alpine
    container_name: drone-nginx-gcp
    ports:
      - "8003:80"
    volumes:
      - ./nginx/drone-gcp.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - drone-server
    restart: unless-stopped
    networks:
      - drone-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servicio de monitoreo (opcional)
  prometheus:
    image: prom/prometheus:latest
    container_name: drone-prometheus-gcp
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.drone.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - drone-network

volumes:
  drone_data:
    driver: local

networks:
  drone-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
