version: '3.8'

services:
  # Backend para QA
  backend-qa:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospital-backend-qa
    ports:
      - "8081:8080"
    environment:
      - NODE_ENV=qa
      - DB_HOST=34.10.223.20
      - DB_PORT=1522
      - DB_SID=XE
      - DB_USER=system
      - DB_PASSWORD=Oracle123
      - LOG_LEVEL=info
    networks:
      - hospital-qa-network
    restart: unless-stopped

  # Frontend para QA
  frontend-qa:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospital-frontend-qa
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=qa
      - VITE_API_URL=http://34.10.223.20:8081
    networks:
      - hospital-qa-network
    restart: unless-stopped
    depends_on:
      - backend-qa

  # Nginx para QA
  nginx-qa:
    image: nginx:alpine
    container_name: hospital-nginx-qa
    ports:
      - "81:80"
    volumes:
      - ./nginx/qa.conf:/etc/nginx/conf.d/default.conf
    networks:
      - hospital-qa-network
    restart: unless-stopped
    depends_on:
      - frontend-qa
      - backend-qa

  # Tests de integración
  integration-tests:
    build:
      context: ./tests
      dockerfile: Dockerfile
    container_name: hospital-integration-tests
    environment:
      - API_URL=http://backend-qa:8080
      - DB_HOST=34.10.223.20
      - DB_PORT=1522
    networks:
      - hospital-qa-network
    depends_on:
      - backend-qa
    command: ["npm", "run", "test:integration"]

networks:
  hospital-qa-network:
    driver: bridge