---
# Pipeline para rama DEV
kind: pipeline
type: docker
name: hospital-dev
trigger:
  branch: [dev]

steps:
- name: build-frontend
  image: node:18-alpine
  commands:
  - echo "Building Hospital Frontend - DEV..."
  - npm ci
  - npm run build
  - echo "Frontend build completed"

- name: build-backend
  image: openjdk:17-alpine
  commands:
  - echo "Building Hospital Backend - DEV..."
  - cd backend
  - ./mvnw clean compile
  - echo "Backend build completed"

- name: test-frontend
  image: node:18-alpine
  commands:
  - echo "Testing Hospital Frontend - DEV..."
  - npm run test:unit
  - echo "Frontend tests completed"

- name: test-backend
  image: openjdk:17-jdk-slim
  environment:
    JAVA_OPTS: "-Djava.awt.headless=true -Djava.security.egd=file:/dev/./urandom"
    MAVEN_OPTS: "-Xmx1024m"
    SPRING_PROFILES_ACTIVE: "test"
    QUARKUS_PROFILE: "test"
  commands:
  - echo "Installing dependencies..."
  - apt-get update && apt-get install -y fontconfig fonts-dejavu-core curl
  - echo "Testing Hospital Backend - DEV..."
  - cd backend
  - ./mvnw test -Djava.awt.headless=true -Dspring.profiles.active=test -Dquarkus.profile=test -Dquarkus.test.continuous-testing=disabled
  - echo "Backend tests completed"

- name: sonar-backend-dev
  image: openjdk:17-jdk-slim
  environment:
    SONAR_HOST_URL: "http://104.197.237.11:9003"
    SONAR_TOKEN: "sqa_9e95b3a3e0b243715a9b438fb7a08c1060e7123a"
  commands:
  - echo "Running SonarQube analysis for Backend - DEV..."
  - apt-get update && apt-get install -y curl
  - chmod +x analyze-backend-sonar-dev.sh
  - ./analyze-backend-sonar-dev.sh
  - echo "Backend SonarQube analysis completed"

- name: sonar-frontend-dev
  image: openjdk:17-jdk-slim
  environment:
    SONAR_HOST_URL: "http://104.197.237.11:9003"
    SONAR_TOKEN: "sqa_9e95b3a3e0b243715a9b438fb7a08c1060e7123a"
  commands:
  - echo "Installing Node.js and SonarQube Scanner..."
  - apt-get update && apt-get install -y curl
  - curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
  - apt-get install -y nodejs
  - npm install -g sonar-scanner
  - echo "Running SonarQube analysis for Frontend - DEV..."
  - sonar-scanner -Dsonar.projectKey=hospital-frontend-dev -Dsonar.host.url=http://104.197.237.11:9003 -Dsonar.login=sqa_9e95b3a3e0b243715a9b438fb7a08c1060e7123a
  - echo "Frontend SonarQube analysis completed"

