            </li>
          {{ end }}
          </ul>
          <hr>
          <p><a href="{{ .ExternalURL }}">Ver en Grafana</a></p>

# Configuración de inhibiciones (evitar alertas redundantes)
inhibit_rules:
  # Si el backend está caído, no alertar sobre otros problemas del backend
  - source_match:
      alertname: 'BackendDown'
    target_match:
      component: 'backend'
    equal: ['instance']
    
  # Si el frontend está caído, no alertar sobre otros problemas del frontend
  - source_match:
      alertname: 'FrontendDown'
    target_match:
      component: 'frontend'
    equal: ['instance']

