# SonarQube configuration for Hospital Frontend (default)
sonar.projectKey=hospital-frontend
sonar.projectName=Hospital Frontend
sonar.projectVersion=1.0.0

# Source code
sonar.sources=src
sonar.tests=src/**/*.spec.ts,src/**/*.test.ts
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js,**/*.min.css,**/public/**,**/assets/**
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Quality Gate
sonar.qualitygate.wait=true

# Additional properties
sonar.sourceEncoding=UTF-8