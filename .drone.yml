---
kind: pipeline
type: docker
name: hospital-dev

trigger:
  branch:
    - dev

steps:
- name: build-frontend
  image: node:18-alpine
  commands:
    - echo "Building Hospital Frontend - DEV..."
    - npm ci
    - npm run build
    - echo "Frontend build completed"

- name: build-backend
  image: openjdk:17-alpine
  commands:
    - echo "Building Hospital Backend - DEV..."
    - cd backend
    - ./mvnw clean compile
    - echo "Backend build completed"

- name: test-frontend
  image: node:18-alpine
  commands:
    - echo "Testing Hospital Frontend - DEV..."
    - npm run test:unit
    - echo "Frontend tests completed"

- name: test-backend
  image: openjdk:17-jdk-slim
  environment:
    JAVA_OPTS: "-Djava.awt.headless=true"
    MAVEN_OPTS: "-Xmx1024m"
    SPRING_PROFILES_ACTIVE: "test"
  commands:
    - echo "Installing dependencies..."
    - apt-get update && apt-get install -y fontconfig fonts-dejavu-core
    - echo "Testing Hospital Backend - DEV..."
    - cd backend
    - ./mvnw test
    - echo "Backend tests completed"

- name: deploy-test-dev
  image: alpine:latest
  commands:
    - echo "Testing deployment process - DEV"
    - echo "Deployment test completed successfully"

