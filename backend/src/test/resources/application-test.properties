# Configuración de test para el Hospital
# Usa H2 en memoria para tests rápidos

# Configuración de H2 para tests
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=

# Configuración del servidor para tests
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# CORS para tests
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-allow-credentials=true

# Hibernate para tests - genera esquema automáticamente
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Configuraciones de conexión para tests
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.initial-size=1

# JWT para tests
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=quarkus

# Configuración de Email para tests (mock)
quarkus.mailer.mock=true

# Configuración de test
quarkus.test.continuous-testing=enabled
quarkus.test.integration-test-profile=test

# Logging para tests
quarkus.log.level=WARN
quarkus.log.category."com.unis".level=WARN

# Deshabilitar métricas en tests
quarkus.smallrye-metrics.enabled=false
quarkus.smallrye-health.enabled=false
