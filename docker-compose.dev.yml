version: '3.8'

services:
  # Backend para desarrollo
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospital-backend-dev
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - DB_HOST=34.10.223.20
      - DB_PORT=1521
      - DB_SID=XE
      - DB_USER=system
      - DB_PASSWORD=Oracle123
      - LOG_LEVEL=debug
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - hospital-dev-network
    restart: unless-stopped

  # Frontend para desarrollo
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospital-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://34.10.223.20:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - hospital-dev-network
    restart: unless-stopped
    depends_on:
      - backend-dev

  # Nginx para desarrollo
  nginx-dev:
    image: nginx:alpine
    container_name: hospital-nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
    networks:
      - hospital-dev-network
    restart: unless-stopped
    depends_on:
      - frontend-dev
      - backend-dev

networks:
  hospital-dev-network:
    driver: bridge