  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'humbertovenavente7@gmail.com'
  smtp_auth_username: 'humbertovenavente7@gmail.com'
  smtp_auth_password: 'xyzf sjrm wjpz dzjb'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'

  - name: 'critical-alerts'
    email_configs:
      - to: 'humbertovenavente7@gmail.com'
        subject: '[CRÍTICO] Alerta del Hospital: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alerta: {{ .Annotations.summary }}
          Descripción: {{ .Annotations.description }}
          Instancia: {{ .Labels.instance }}
          Tiempo: {{ .StartsAt }}
          {{ end }}

  - name: 'warning-alerts'
    email_configs:
      - to: 'humbertovenavente7@gmail.com'
        subject: '[ADVERTENCIA] Alerta del Hospital: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alerta: {{ .Annotations.summary }}
          Descripción: {{ .Annotations.description }}
          Instancia: {{ .Labels.instance }}
          Tiempo: {{ .StartsAt }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']
