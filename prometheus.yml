global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'hospital-monitoring'

rule_files:
  - "prometheus-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s

  # Backend Quarkus - Métricas de la aplicación
  - job_name: 'hospital-backend-prod'
    static_configs:
      - targets: ['34.61.228.49:8020']
    metrics_path: '/q/metrics'
    scrape_interval: 10s
    honor_labels: true

  - job_name: 'hospital-backend-qa'
    static_configs:
      - targets: ['34.61.228.49:8030']
    metrics_path: '/q/metrics'
    scrape_interval: 10s
    honor_labels: true

  - job_name: 'hospital-backend-dev'
    static_configs:
      - targets: ['34.61.228.49:8060']
    metrics_path: '/q/metrics'
    scrape_interval: 10s
    honor_labels: true

  # Frontend - Métricas de la aplicación
  - job_name: 'hospital-frontend-prod'
    static_configs:
      - targets: ['frontend-prod:80']
    scrape_interval: 30s

  - job_name: 'hospital-frontend-qa'
    static_configs:
      - targets: ['frontend-qa:80']
    scrape_interval: 30s

  - job_name: 'hospital-frontend-dev'
    static_configs:
      - targets: ['frontend-dev:80']
    scrape_interval: 30s

  # Nginx - Métricas del proxy
  - job_name: 'nginx-prod'
    static_configs:
      - targets: ['nginx-prod:80']
    scrape_interval: 30s

  - job_name: 'nginx-qa'
    static_configs:
      - targets: ['nginx-qa:80']
    scrape_interval: 30s

  - job_name: 'nginx-dev'
    static_configs:
      - targets: ['nginx-dev:80']
    scrape_interval: 30s

  # Drone CI/CD - Métricas del pipeline
  - job_name: 'drone-server'
    static_configs:
      - targets: ['34.61.228.49:8002']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'drone-runner'
    static_configs:
      - targets: ['34.61.228.49:8002']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # SonarQube - Métricas de calidad
  - job_name: 'sonarqube'
    static_configs:
      - targets: ['34.61.228.49:9003']
    metrics_path: '/api/monitoring/metrics'
    scrape_interval: 60s

  # Oracle Database - Métricas de la base de datos
  - job_name: 'oracle-database'
    static_configs:
      - targets: ['oracle-prod:1521']
    scrape_interval: 60s

  # Node Exporter - Métricas del sistema
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # cAdvisor - Métricas de contenedores
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s

  # Nginx Exporter - Métricas detalladas de Nginx
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 15s

  # JMX Exporter - Métricas de Java/Oracle
  - job_name: 'jmx-exporter'
    static_configs:
      - targets: ['jmx-exporter:9999']
    scrape_interval: 15s
