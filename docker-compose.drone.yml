version: '3.8'

services:
  # Drone Server
  drone-server:
    image: drone/drone:2
    container_name: drone-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - drone_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Configuración de Drone
      - DRONE_GITHUB_CLIENT_ID=${DRONE_GITHUB_CLIENT_ID}
      - DRONE_GITHUB_CLIENT_SECRET=${DRONE_GITHUB_CLIENT_SECRET}
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET}
      - DRONE_SERVER_HOST=${DRONE_SERVER_HOST}
      - DRONE_SERVER_PROTO=${DRONE_SERVER_PROTO}
      - DRONE_USER_CREATE=username:${DRONE_ADMIN_USER},admin:true
      - DRONE_LOGS_DEBUG=true
      - DRONE_LOGS_TRACE=true
      # Configuración de Docker
      - DRONE_DOCKER_ENABLED=true
      - DRONE_DOCKER_HOST=unix:///var/run/docker.sock
      # Configuración de ambientes
      - DRONE_ENVIRONMENT=dev,qa,prod
      # Configuración de métricas de Prometheus
      - DRONE_PROMETHEUS_ENABLED=true
      - DRONE_PROMETHEUS_ENDPOINT=/metrics
    restart: unless-stopped
    networks:
      - drone-network

  # Drone Runner
  drone-runner:
    image: drone/drone-runner-docker:1
    container_name: drone-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DRONE_RPC_PROTO=${DRONE_RPC_PROTO}
      - DRONE_RPC_HOST=${DRONE_RPC_HOST}
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET}
      - DRONE_DEBUG=true
      - DRONE_TRACE=true
      # Configuración de Docker
      - DRONE_DOCKER_ENABLED=true
      - DRONE_DOCKER_HOST=unix:///var/run/docker.sock
      # Límites de recursos
      - DRONE_RUNNER_CAPACITY=3
      - DRONE_RUNNER_LABELS=os:linux,arch:amd64
    restart: unless-stopped
    depends_on:
      - drone-server
    networks:
      - drone-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: drone-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/drone.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - drone-server
    restart: unless-stopped
    networks:
      - drone-network

volumes:
  drone_data:
    driver: local

networks:
  drone-network:
    driver: bridge
