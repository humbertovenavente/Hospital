apiVersion: 1

notifiers:
  # Configuración de Email para alertas
  - name: email-alerts
    type: email
    uid: email_channel
    org_id: 1
    is_default: false
    settings:
      addresses: "jflores@unis.edu.gt,jnajar@unis.edu.gt"
      enabled: true
      singleEmail: true
      uploadImage: true

  # Configuración de Slack para alertas
  - name: slack-alerts
    type: slack
    uid: slack_channel
    org_id: 1
    is_default: true
    settings:
      url: "${SLACK_WEBHOOK_URL}"
      username: "Grafana Hospital"
      channel: "#hospital-alerts"
      title: "Alerta del Hospital"
      text: "{{.Title}} - {{.Message}}"
      iconEmoji: ":hospital:"
      token: "${SLACK_BOT_TOKEN}"
      recipient: "#hospital-alerts"
      uploadImage: true
      mentionUsers: ""
      mentionGroups: ""
      mentionChannel: "here"
      skipTLSVerify: false

