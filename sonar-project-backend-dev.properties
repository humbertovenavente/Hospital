# SonarQube configuration for Hospital Backend - Development
sonar.projectKey=hospital-backend-dev
sonar.projectName=Hospital Backend - Development
sonar.projectVersion=1.0.0

# Source code
sonar.sources=backend/src/main/java
sonar.tests=backend/src/test/java
sonar.java.binaries=backend/target/classes
sonar.java.libraries=backend/target/dependency/*.jar

# Coverage reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=backend/target/surefire-reports

# Exclusions
sonar.exclusions=**/target/**,**/node_modules/**,**/*.min.js,**/*.min.css
sonar.test.exclusions=**/target/**

# Quality Gate
sonar.qualitygate.wait=true

# Configuración estricta para causar fallos en el pipeline
# Límites de cobertura de código
sonar.coverage.exclusions=**/target/**,**/test/**,**/*Test.java,**/*Tests.java
sonar.coverage.minimum=80.0

# Límites de duplicación de código
sonar.cpd.minimumtokens=50
sonar.cpd.minimumLines=10

# Límites de complejidad ciclomática
sonar.complexity.max=10

# Límites de líneas de código por archivo
sonar.squid.maximumLineLength=120

# Límites de métodos por clase
sonar.squid.maximumMethodsPerClass=20

# Límites de parámetros por método
sonar.squid.maximumParametersPerMethod=5

# Configuración de reglas estrictas
sonar.java.checkstyle.reportPaths=backend/target/checkstyle-result.xml
sonar.java.pmd.reportPaths=backend/target/pmd.xml
sonar.java.spotbugs.reportPaths=backend/target/spotbugs.xml

# Additional properties
sonar.sourceEncoding=UTF-8
sonar.java.source=17
sonar.java.target=17

# Configuración para fallar con cualquier problema crítico
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1186
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java