# SonarQube configuration for Hospital Frontend - Development
sonar.projectKey=frontend-hospital-dev-drone
sonar.projectName=Hospital Frontend - Development
sonar.projectVersion=1.0.0

# Source code
sonar.sources=src
sonar.tests=src/components/__tests__
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js,**/*.min.css,**/public/**,**/assets/**
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Quality Gate
sonar.qualitygate.wait=true

# Additional properties
sonar.sourceEncoding=UTF-8