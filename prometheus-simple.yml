global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Sistema (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Contenedores (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Backend Hospital (si está ejecutándose)
  - job_name: 'hospital-backend'
    static_configs:
      - targets: ['localhost:8082']
    metrics_path: '/q/metrics'
    scrape_interval: 10s
