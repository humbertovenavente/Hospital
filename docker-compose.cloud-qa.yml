version: '3.8'

services:
  # Backend para QA en la nube
  backend-qa:
    build:
      context: ./backend
      dockerfile: Dockerfile.jvm
    container_name: hospital-backend-qa-cloud
    ports:
      - "8030:8080"
    environment:
      - NODE_ENV=production
      - QUARKUS_PROFILE=qa
      - DB_HOST=34.56.133.126
      - DB_PORT=1522
      - DB_SID=XE
      - DB_USER=system
      - DB_PASSWORD=Oracle123
      - LOG_LEVEL=info
    networks:
      - hospital-qa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend para QA en la nube
  frontend-qa:
    build:
      context: .
      dockerfile: Dockerfile.frontend.cloud
      args:
        - NODE_ENV=production
        - VITE_API_URL=http://104.197.237.11:8030
    container_name: hospital-frontend-qa-cloud
    ports:
      - "8031:80"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://104.197.237.11:8030
    networks:
      - hospital-qa-network
    restart: unless-stopped
    depends_on:
      - backend-qa
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  hospital-qa-network:
    driver: bridge
