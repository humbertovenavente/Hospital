groups:
  - name: hospital-alerts
    rules:
      # Alertas de la aplicación
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alto uso de CPU en {{ $labels.instance }}"
          description: "El uso de CPU está por encima del 80% durante más de 5 minutos"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alto uso de memoria en {{ $labels.instance }}"
          description: "El uso de memoria está por encima del 85% durante más de 5 minutos"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Espacio en disco bajo en {{ $labels.instance }}"
          description: "El espacio en disco está por debajo del 10%"

      - alert: ApplicationDown
        expr: up{job=~"hospital-backend-.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Aplicación Hospital caída"
          description: "La aplicación Hospital no responde en {{ $labels.instance }}"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tiempo de respuesta alto"
          description: "El 95% de las peticiones tardan más de 2 segundos"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alta tasa de errores"
          description: "La tasa de errores 5xx está por encima del 5%"

      # Alertas del pipeline CI/CD
      - alert: DroneServerDown
        expr: up{job="drone-server"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Servidor Drone caído"
          description: "El servidor Drone CI/CD no responde"

      - alert: DroneRunnerDown
        expr: up{job="drone-runner"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Runner Drone caído"
          description: "El runner Drone CI/CD no responde"

      - alert: BuildFailureRate
        expr: rate(drone_builds_total{status="failure"}[1h]) / rate(drone_builds_total[1h]) * 100 > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Alta tasa de fallos en builds"
          description: "La tasa de fallos en builds está por encima del 20%"

      - alert: LongBuildTime
        expr: histogram_quantile(0.95, rate(drone_build_duration_seconds_bucket[1h])) > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tiempo de build muy largo"
          description: "El 95% de los builds tardan más de 30 minutos"

      # Alertas de la base de datos
      - alert: DatabaseConnectionHigh
        expr: hikaricp_connections_active / hikaricp_connections_max * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alto uso de conexiones de base de datos"
          description: "El uso de conexiones está por encima del 80%"

      - alert: DatabaseSlowQueries
        expr: histogram_quantile(0.95, rate(hibernate_session_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consultas lentas en base de datos"
          description: "El 95% de las consultas tardan más de 5 segundos"

      # Alertas de SonarQube
      - alert: SonarQubeDown
        expr: up{job="sonarqube"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "SonarQube caído"
          description: "El servidor SonarQube no responde"

      - alert: HighTechnicalDebt
        expr: sonar_technical_debt_ratio > 5
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Alta deuda técnica"
          description: "La deuda técnica está por encima del 5%"

      - alert: LowCodeCoverage
        expr: sonar_coverage < 70
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Cobertura de código baja"
          description: "La cobertura de código está por debajo del 70%"
