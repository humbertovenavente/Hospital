---
kind: pipeline
type: docker
name: hospital-dev

trigger:
  branch:
    - dev

volumes:
- name: docker_sock
  host:
    path: /var/run/docker.sock

steps:
- name: build-frontend
  image: node:18-alpine
  commands:
    - echo "Building Hospital Frontend - DEV..."
    - npm ci
    - npm run build
    - echo "Frontend build completed"

- name: build-backend
  image: openjdk:17-alpine
  commands:
    - echo "Building Hospital Backend - DEV..."
    - cd backend
    - ./mvnw clean compile
    - echo "Backend build completed"

- name: test-frontend
  image: node:18-alpine
  commands:
    - echo "Testing Hospital Frontend - DEV..."
    - npm run test:unit -- --coverage
    - echo "Frontend tests completed"

- name: test-backend
  image: openjdk:17-jdk-slim
  environment:
    JAVA_OPTS: "-Djava.awt.headless=true"
    MAVEN_OPTS: "-Xmx1024m"
    SPRING_PROFILES_ACTIVE: "test"
  commands:
    - echo "Installing dependencies..."
    - apt-get update && apt-get install -y fontconfig fonts-dejavu-core
    - echo "Testing Hospital Backend - DEV..."
    - cd backend
    - ./mvnw test
    - echo "Backend tests completed"

- name: sonar-backend-dev
  image: openjdk:17-jdk-slim
  environment:
    SONAR_HOST_URL: "http://34.61.228.49:9003"
    SONAR_TOKEN: "sqa_9e95b3a3e0b243715a9b438fb7a08c1060e7123a"
  commands:
    - echo "Running SonarQube analysis for Backend - DEV..."
    - apt-get update && apt-get install -y curl
    - chmod +x analyze-backend-sonar-dev.sh
    - ./analyze-backend-sonar-dev.sh
    - echo "Backend SonarQube analysis completed"

- name: sonar-frontend-dev
  image: openjdk:17-jdk-slim
  environment:
    SONAR_HOST_URL: "http://34.61.228.49:9003"
    SONAR_TOKEN: "sqa_9e95b3a3e0b243715a9b438fb7a08c1060e7123a"
  commands:
    - echo "Installing Node.js and SonarQube Scanner..."
    - apt-get update && apt-get install -y curl
    - curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
    - apt-get install -y nodejs
    - npm install -g sonar-scanner
    - echo "Running SonarQube analysis for Frontend - DEV..."
    - npx sonar-scanner -Dsonar.projectKey=frontend-hospital-dev-drone -Dsonar.host.url=http://34.61.228.49:9003 -Dsonar.login=sqa_9e95b3a3e0b243715a9b438fb7a08c1060e7123a -Dsonar.sources=src -Dsonar.tests=src/components/__tests__ -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
    - echo "Frontend SonarQube analysis completed"
    - echo "Checking SonarQube quality gate status..."
    - |
      # Verificar el estado del quality gate
      PROJECT_KEY="frontend-hospital-dev-drone"
      RESPONSE=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$PROJECT_KEY")
      echo "SonarQube API Response: $RESPONSE"
      QUALITY_GATE_STATUS=$(echo "$RESPONSE" | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
      echo "Quality Gate Status: $QUALITY_GATE_STATUS"
      if [ "$QUALITY_GATE_STATUS" != "OK" ]; then
        echo "❌ SonarQube Quality Gate FAILED for Frontend - DEV"
        echo "Coverage or code quality requirements not met"
        exit 1
      else
        echo "✅ SonarQube Quality Gate PASSED for Frontend - DEV"
      fi

- name: build-docker-backend-dev
  image: docker:20.10.16
  privileged: true
  volumes:
  - name: docker_sock
    path: /var/run/docker.sock
  commands:
    - echo "Building Backend Docker image - DEV..."
    - cd backend
    - docker build -f Dockerfile.jvm -t hospital-backend-dev .
    - echo "Backend Docker image built successfully"

- name: build-docker-frontend-dev
  image: docker:20.10.16
  privileged: true
  volumes:
  - name: docker_sock
    path: /var/run/docker.sock
  commands:
    - echo "Building Frontend Docker image - DEV..."
    - docker build -f Dockerfile.frontend -t hospital-frontend-dev .
    - echo "Frontend Docker image built successfully"

- name: deploy-backend-dev
  image: docker:20.10.16
  privileged: true
  volumes:
  - name: docker_sock
    path: /var/run/docker.sock
  commands:
    - echo "Deploying Backend - DEV..."
    - docker stop hospital-backend-dev-cloud || true
    - docker rm -f hospital-backend-dev-cloud || true
    - docker run -d --name hospital-backend-dev-cloud --restart=always -p 8060:8080 -e NODE_ENV=development -e QUARKUS_PROFILE=dev -e DB_HOST=34.56.133.126 -e DB_PORT=1521 -e DB_SID=XE -e DB_USER=system -e DB_PASSWORD=Oracle123 -e LOG_LEVEL=debug -e QUARKUS_HTTP_CORS_ORIGINS=http://34.61.228.49:8061,http://34.61.228.49:8060,http://localhost:5173,http://localhost:5174,http://localhost:8061 -e QUARKUS_HTTP_CORS_METHODS=GET,POST,PUT,DELETE,OPTIONS,PATCH -e QUARKUS_HTTP_CORS_HEADERS=* -e QUARKUS_HTTP_CORS_ACCESS_CONTROL_ALLOW_CREDENTIALS=true -e QUARKUS_HTTP_CORS_EXPOSED_HEADERS=Content-Disposition -e QUARKUS_HTTP_CORS_MAX_AGE=3600 hospital-backend-dev
    - echo "Backend DEV deployed successfully on port 8060"

- name: deploy-frontend-dev
  image: docker:20.10.16
  privileged: true
  volumes:
  - name: docker_sock
    path: /var/run/docker.sock
  commands:
    - echo "Deploying Frontend - DEV..."
    - docker stop hospital-frontend-dev-cloud || true
    - docker rm hospital-frontend-dev-cloud || true
    - docker run -d --name hospital-frontend-dev-cloud --restart=always -p 8061:80 hospital-frontend-dev
    - echo "Frontend DEV deployed successfully on port 8061"

- name: notify-failure-dev
  image: alpine:latest
  environment:
    GMAIL_USER: "humbertovenavente7@gmail.com"
    GMAIL_APP_PASSWORD: "xyzf sjrm wjpz dzjb"
    PIPELINE_NAME: "Hospital DEV"
    DRONE_COMMIT_BRANCH: "dev"
  commands:
    - apk add --no-cache curl
    - |
      if [ "$DRONE_BUILD_STATUS" = "failure" ]; then
        # Send to jflores@unis.edu.gt
        curl -s --url 'smtps://smtp.gmail.com:465' \
          --ssl-reqd \
          --mail-from "$GMAIL_USER" \
          --mail-rcpt "jflores@unis.edu.gt" \
          --user "$GMAIL_USER:$GMAIL_APP_PASSWORD" \
          -T - <<EOF
      From: $GMAIL_USER
      To: jflores@unis.edu.gt
      Subject: Pipeline Failure - $PIPELINE_NAME
      
      Pipeline failed in branch: $DRONE_COMMIT_BRANCH
      Build Number: $DRONE_BUILD_NUMBER
      Commit: $DRONE_COMMIT_SHA
      Time: $(date)
      
      Please check the Drone CI dashboard for details.
      EOF
        # Send to jnajar@unis.edu.gt
        curl -s --url 'smtps://smtp.gmail.com:465' \
          --ssl-reqd \
          --mail-from "$GMAIL_USER" \
          --mail-rcpt "jnajar@unis.edu.gt" \
          --user "$GMAIL_USER:$GMAIL_APP_PASSWORD" \
          -T - <<EOF
      From: $GMAIL_USER
      To: jnajar@unis.edu.gt
      Subject: Pipeline Failure - $PIPELINE_NAME
      
      Pipeline failed in branch: $DRONE_COMMIT_BRANCH
      Build Number: $DRONE_BUILD_NUMBER
      Commit: $DRONE_COMMIT_SHA
      Time: $(date)
      
      Please check the Drone CI dashboard for details.
      EOF
        echo "Failure notifications sent to jflores@unis.edu.gt and jnajar@unis.edu.gt"
      fi
  when:
    status: [ failure ]

