global:
  # Configuración de email para alertas
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '${GMAIL_FROM_ADDRESS}'
  smtp_auth_username: '${GMAIL_USER}'
  smtp_auth_password: '${GMAIL_PASSWORD}'
  smtp_require_tls: true

# Configuración de Slack
# Nota: Debes configurar SLACK_WEBHOOK_URL y SLACK_CHANNEL como variables de entorno

route:
  # Ruta principal para todas las alertas
  receiver: 'default-receiver'
  
  # Agrupar alertas por severity
  group_by: ['alertname', 'severity']
  
  # Tiempo de espera antes de agrupar alertas
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  
  # Rutas específicas por severity
  routes:
    # Alertas críticas - enviar a ambos canales
    - match:
        severity: critical
      receiver: 'critical-alerts'
      
    # Alertas de warning - solo email
    - match:
        severity: warning
      receiver: 'warning-alerts'
      
    # Alertas de info
    - match:
        severity: info
      receiver: 'info-alerts'

receivers:
  # Receiver por defecto - solo email
  - name: 'default-receiver'
    email_configs:
      - to: 'jflores@unis.edu.gt'
        send_resolved: true
        headers:
          Subject: 'Alerta del Hospital: {{ .GroupLabels.alertname }}'
        html: |
          <h2>Alerta: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Severidad:</strong> {{ .CommonLabels.severity }}</p>
          <p><strong>Componente:</strong> {{ .CommonLabels.component }}</p>
          <hr>
          <h3>Detalles:</h3>
          <ul>
          {{ range .Alerts }}
            <li>
              <strong>{{ .Annotations.summary }}</strong><br>
              {{ .Annotations.description }}<br>
              <small>Timestamp: {{ .StartsAt }}</small>
            </li>
          {{ end }}
          </ul>
          <hr>
          <p><a href="{{ .ExternalURL }}">Ver en Grafana</a></p>

  # Receiver para alertas críticas - email + Slack
  - name: 'critical-alerts'
    email_configs:
      - to: 'jflores@unis.edu.gt,jnajar@unis.edu.gt'
        send_resolved: true
        headers:
          Subject: '🚨 ALERTA CRÍTICA - Hospital: {{ .GroupLabels.alertname }}'
        html: |
          <h2 style="color: red;">🚨 ALERTA CRÍTICA</h2>
          <p><strong>Alerta:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Severidad:</strong> {{ .CommonLabels.severity }}</p>
          <p><strong>Componente:</strong> {{ .CommonLabels.component }}</p>
          <hr>
          <h3>Detalles:</h3>
          <ul>
          {{ range .Alerts }}
            <li>
              <strong>{{ .Annotations.summary }}</strong><br>
              {{ .Annotations.description }}<br>
              <small>Timestamp: {{ .StartsAt }}</small>
            </li>
          {{ end }}
          </ul>
          <hr>
          <p><a href="{{ .ExternalURL }}">Ver en Grafana</a></p>
    
    # Configuración de Slack para alertas críticas
    # Descomentar y configurar cuando se tenga el webhook de Slack
    # slack_configs:
    #   - api_url: '${SLACK_WEBHOOK_URL}'
    #     channel: '#hospital-alerts'
    #     username: 'Grafana Hospital'
    #     icon_emoji: ':hospital:'
    #     title: '🚨 ALERTA CRÍTICA - {{ .GroupLabels.alertname }}'
    #     text: |
    #       *Alerta:* {{ .GroupLabels.alertname }}
    #       *Severidad:* {{ .CommonLabels.severity }}
    #       *Componente:* {{ .CommonLabels.component }}
    #       
    #       {{ range .Alerts }}
    #       *{{ .Annotations.summary }}*
    #       {{ .Annotations.description }}
    #       {{ end }}
    #       <{{ .ExternalURL }}|Ver en Grafana>
    #     send_resolved: true

  # Receiver para alertas de warning - solo email
  - name: 'warning-alerts'
    email_configs:
      - to: 'jflores@unis.edu.gt'
        send_resolved: true
        headers:
          Subject: '⚠️ Advertencia - Hospital: {{ .GroupLabels.alertname }}'
        html: |
          <h2 style="color: orange;">⚠️ ADVERTENCIA</h2>
          <p><strong>Alerta:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Severidad:</strong> {{ .CommonLabels.severity }}</p>
          <p><strong>Componente:</strong> {{ .CommonLabels.component }}</p>
          <hr>
          <h3>Detalles:</h3>
          <ul>
          {{ range .Alerts }}
            <li>
              <strong>{{ .Annotations.summary }}</strong><br>
              {{ .Annotations.description }}<br>
              <small>Timestamp: {{ .StartsAt }}</small>
            </li>
          {{ end }}
          </ul>
          <hr>
          <p><a href="{{ .ExternalURL }}">Ver en Grafana</a></p>

  # Receiver para alertas de info
  - name: 'info-alerts'
    email_configs:
      - to: 'jflores@unis.edu.gt'
        send_resolved: true
        headers:
          Subject: 'ℹ️ Información - Hospital: {{ .GroupLabels.alertname }}'
        html: |
          <h2>ℹ️ INFORMACIÓN</h2>
