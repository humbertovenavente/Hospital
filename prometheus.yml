global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'hospital-monitoring'

rule_files:
  - "prometheus-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s

  # Backend Quarkus - Pipeline (solo DEV funcional)
  - job_name: 'hospital-backend-pipeline'
    static_configs:
      - targets: 
        - '34.61.228.49:8060'  # DEV
    metrics_path: '/q/metrics'
    scrape_interval: 30s
    honor_labels: true
    relabel_configs:
      - source_labels: [__address__]
        target_label: environment
        regex: '34.61.228.49:8060'
        replacement: 'dev'

  # Frontend - Pipeline (solo DEV funcional)
  - job_name: 'hospital-frontend-pipeline'
    static_configs:
      - targets: 
        - '34.61.228.49:8061'  # DEV
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_protocols: ['OpenMetricsText1.0.0', 'PrometheusText1.0.0']
    fallback_scrape_protocol: 'PrometheusText0.0.4'
    honor_labels: true
    relabel_configs:
      - source_labels: [__address__]
        target_label: environment
        regex: '34.61.228.49:8061'
        replacement: 'dev'

  # Node Exporter - Métricas del sistema
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['34.61.228.49:9100']
    scrape_interval: 15s

  # cAdvisor - Métricas de contenedores
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['34.61.228.49:8080']
    scrape_interval: 15s

  # Drone CI/CD - Métricas del pipeline
  - job_name: 'drone-server'
    static_configs:
      - targets: ['34.61.228.49:8002']
    metrics_path: '/metrics'
    scrape_interval: 15s
