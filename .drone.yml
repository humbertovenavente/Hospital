  - echo "Installing dependencies..."
  - apt-get update && apt-get install -y fontconfig fonts-dejavu-core curl
  - echo "Testing Hospital Backend - QA..."
  - cd backend
  - ./mvnw test -Djava.awt.headless=true -Dspring.profiles.active=test -Dquarkus.profile=test -Dquarkus.test.continuous-testing=disabled
  - echo "Backend tests completed"

- name: sonar-backend-qa
  image: openjdk:17-jdk-slim
  environment:
    SONAR_HOST_URL: "http://34.46.73.44:9003"
    SONAR_TOKEN: "sqa_9e95b3a3e0b243715a9b438fb7a08c1060e7123a"
  commands:
  - echo "Running SonarQube analysis for Backend - QA..."
  - apt-get update && apt-get install -y curl
  - chmod +x analyze-backend-sonar-dev.sh
  - SONAR_CONFIG=sonar-project-backend-qa.properties ./analyze-backend-sonar-dev.sh
  - echo "Backend SonarQube analysis completed"

- name: sonar-frontend-qa
  image: openjdk:17-jdk-slim
  environment:
    SONAR_HOST_URL: "http://34.46.73.44:9003"
    SONAR_TOKEN: "sqa_9e95b3a3e0b243715a9b438fb7a08c1060e7123a"
  commands:
  - echo "Installing Node.js and SonarQube Scanner..."
  - apt-get update && apt-get install -y curl
  - curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
  - apt-get install -y nodejs
  - npm install -g sonar-scanner
  - echo "Running SonarQube analysis for Frontend - QA..."
  - sonar-scanner -Dsonar.projectKey=frontend-hospital-qa-drone -Dsonar.host.url=http://34.46.73.44:9003 -Dsonar.login=sqa_9e95b3a3e0b243715a9b438fb7a08c1060e7123a -Dsonar.sources=src -Dsonar.tests=src/components/__tests__ -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts
  - echo "Frontend SonarQube analysis completed"

- name: deploy-backend-qa
  image: docker:20.10.16
  volumes:
  - name: docker_sock
    path: /var/run/docker.sock
  commands:
  - echo "Deploying Backend - QA..."
  - docker stop hospital-backend-qa-cloud || true
  - docker rm hospital-backend-qa-cloud || true
  - docker run -d --name hospital-backend-qa-cloud --restart=always -p 8030:8080 hospital-backend-qa
  - echo "Backend QA deployed successfully"

- name: deploy-frontend-qa
  image: docker:20.10.16
  volumes:
  - name: docker_sock
    path: /var/run/docker.sock
  commands:
  - echo "Deploying Frontend - QA..."
  - docker stop hospital-frontend-qa-cloud || true
  - docker rm hospital-frontend-qa-cloud || true
  - docker run -d --name hospital-frontend-qa-cloud --restart=always -p 8031:80 hospital-frontend-qa
  - echo "Frontend QA deployed successfully"

