---
kind: pipeline
type: docker
name: test

steps:
  - name: hello-world
    image: alpine:latest
    commands:
      - echo "Hello from Drone CI/CD!"
      - echo "Date: $(date)"
      - echo "User: $(whoami)"
      - echo "Working directory: $(pwd)"
      - echo "Pipeline ejecutandose correctamente"

  - name: test-node
    image: node:18-alpine
    commands:
      - echo "Node.js version:"
      - node --version
      - echo "NPM version:"
      - npm --version

  - name: test-java
    image: openjdk:17-alpine
    commands:
      - echo "Java version:"
      - java --version
      - echo "Maven version:"
      - mvn --version