upstream drone_server {
    server drone-server:80;
}

server {
    listen 80;
    server_name _;

    # Configuración de logs
    access_log /var/log/nginx/drone_access.log;
    error_log /var/log/nginx/drone_error.log;

    # Configuración de proxy para Drone
    location / {
        proxy_pass http://drone_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Configuración de timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Configuración de buffers
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Configuración de WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Configuración de health check
    location /healthz {
        proxy_pass http://drone_server/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # Configuración de métricas (si está habilitado)
    location /metrics {
        proxy_pass http://drone_server/metrics;
        proxy_set_header Host $host;
        access_log off;
    }

    # Configuración de archivos estáticos
    location /static/ {
        proxy_pass http://drone_server/static/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Configuración de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Configuración de límites
    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;
}

